<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CinePilot Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090b10;
      --card-bg: rgba(22, 27, 34, 0.85);
      --border: rgba(255, 255, 255, 0.1);
      --primary: #7a5af8;
      --primary-hover: #9373f9;
      --accent-danger: #f85149;
      --text: #f0f6fc;
      --text-muted: #8b949e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif; }

    body {
      background: radial-gradient(circle at top right, #1f1b3c, var(--bg) 65%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px 16px;
    }

    .container {
      width: 100%;
      max-width: 560px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.7);
    }

    .header { text-align: center; margin-bottom: 24px; }
    h1 { font-size: 2.1rem; font-weight: 800; letter-spacing: -0.5px; }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin: 22px 0 10px 0;
    }

    /* Switch Component */
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: rgba(13, 17, 23, 0.5);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 8px;
      transition: border-color 0.2s;
    }
    .switch-row.sub-switch {
      margin-left: 12px;
      background: rgba(13, 17, 23, 0.3);
      border-left: 3px solid var(--primary);
    }
    .switch-label { font-size: 0.92rem; font-weight: 600; }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.15);
      transition: .3s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(20px); }

    /* Custom List Builder */
    .custom-list-box {
      background: rgba(13, 17, 23, 0.6);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .input-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    input[type="text"], select {
      width: 100%;
      padding: 11px 14px;
      background: rgba(9, 11, 16, 0.85);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #fff;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: var(--primary); }

    .btn-add {
      width: 100%;
      padding: 10px;
      background: rgba(122, 90, 248, 0.2);
      border: 1px solid var(--primary);
      color: #fff;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-add:hover { background: var(--primary); }

    .list-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px;
    }

    .list-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: rgba(22, 27, 34, 0.95);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.85rem;
    }
    .list-info { display: flex; align-items: center; gap: 8px; overflow: hidden; }
    .list-name { font-weight: 600; }
    .list-tag { font-size: 0.7rem; padding: 2px 6px; background: rgba(255,255,255,0.1); border-radius: 4px; }
    .btn-del {
      background: none;
      border: none;
      color: var(--accent-danger);
      cursor: pointer;
      font-size: 0.95rem;
      padding: 2px 6px;
    }

    .form-group { margin-bottom: 12px; }
    label.field-label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 6px; color: var(--text); }

    .btn-container { display: flex; flex-direction: column; gap: 8px; margin-top: 26px; }

    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      transition: transform 0.15s, background-color 0.2s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); }

    .btn-secondary { background: rgba(255, 255, 255, 0.08); color: var(--text); }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.15); }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>CinePilot Studio</h1>
    </div>

    <!-- 1. Küratörlük Listeleri -->
    <div class="section-title">Kataloglar</div>
    
    <div class="switch-row">
      <span class="switch-label">🔥 Trending Movies</span>
      <label class="switch">
        <input type="checkbox" id="enableTrendingMovies" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="switch-row">
      <span class="switch-label">📺 Trending Series</span>
      <label class="switch">
        <input type="checkbox" id="enableTrendingSeries" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="switch-row">
      <span class="switch-label">✨ Oscar Collection</span>
      <label class="switch">
        <input type="checkbox" id="enableOscar" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="switch-row">
      <span class="switch-label">🏆 Top 250 Movies</span>
      <label class="switch">
        <input type="checkbox" id="enableTop250" checked>
        <span class="slider"></span>
      </label>
    </div>

    <!-- 2. Özel Liste Ekleme -->
    <div class="section-title">Özel Liste Ekle</div>
    <div class="custom-list-box">
      <div class="input-grid">
        <input type="text" id="newListTitle" placeholder="Liste Başlığı">
        <select id="newListType">
          <option value="movie">Film</option>
          <option value="series">Dizi</option>
        </select>
      </div>
      <input type="text" id="newListUrl" placeholder="Letterboxd veya Trakt Liste Linki" style="margin-bottom: 8px;">
      <button type="button" class="btn-add" id="addListBtn">+ Listeyi Ekle</button>

      <div class="list-container" id="customListsContainer"></div>
    </div>

    <!-- 3. Ayarlar & Entegrasyonlar -->
    <div class="section-title">Ayarlar</div>
    
    <div class="form-group">
      <label class="field-label">RPDB API Key</label>
      <input type="text" id="rpdbKey" placeholder="RPDB API Key (İsteğe bağlı)">
    </div>

    <!-- Letterboxd Username & Dynamic Toggles -->
    <div class="form-group">
      <label class="field-label">Letterboxd Kullanıcı Adı</label>
      <input type="text" id="letterboxdUser" placeholder="Letterboxd Kullanıcı Adı (İsteğe bağlı)">
    </div>

    <div id="lbxToggles" style="display: none; margin-bottom: 12px;">
      <div class="switch-row sub-switch">
        <span class="switch-label">📌 Letterboxd Watchlist</span>
        <label class="switch">
          <input type="checkbox" id="enableLbxWatchlist" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="switch-row sub-switch">
        <span class="switch-label">🍿 Letterboxd Diary</span>
        <label class="switch">
          <input type="checkbox" id="enableLbxDiary" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Trakt Username & Dynamic Toggles -->
    <div class="form-group">
      <label class="field-label">Trakt.tv Kullanıcı Adı</label>
      <input type="text" id="traktUser" placeholder="Trakt Kullanıcı Adı (İsteğe bağlı)">
    </div>

    <div id="traktToggles" style="display: none; margin-bottom: 12px;">
      <div class="switch-row sub-switch">
        <span class="switch-label">📌 Trakt Watchlist</span>
        <label class="switch">
          <input type="checkbox" id="enableTraktWatchlist" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Trailers Switch -->
    <div class="switch-row">
      <span class="switch-label">🎬 Trailers</span>
      <label class="switch">
        <input type="checkbox" id="enableTrailers" checked>
        <span class="slider"></span>
      </label>
    </div>

    <!-- 4. Yükleme ve Kopyalama Butonları -->
    <div class="btn-container">
      <a href="#" id="installBtn" class="btn btn-primary">🚀 Stremio'ya Yükle</a>
      <button type="button" id="copyBtn" class="btn btn-secondary">📋 Manifest Linkini Kopyala</button>
    </div>
  </div>

  <script>
    let customLists = [];

    function renderCustomLists() {
      const container = document.getElementById('customListsContainer');
      container.innerHTML = '';

      if (customLists.length === 0) {
        container.innerHTML = '<div style="font-size:0.78rem; color:var(--text-muted); text-align:center; padding:4px;">Henüz özel bir liste eklenmedi.</div>';
        return;
      }

      customLists.forEach((list, idx) => {
        const div = document.createElement('div');
        div.className = 'list-card';
        div.innerHTML = `
          <div class="list-info">
            <span class="list-tag">${list.type === 'series' ? 'DİZİ' : 'FİLM'}</span>
            <span class="list-name">${escapeHtml(list.name)}</span>
          </div>
          <button type="button" class="btn-del" onclick="removeCustomList(${idx})">✕</button>
        `;
        container.appendChild(div);
      });
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function addCustomList() {
      const titleInput = document.getElementById('newListTitle');
      const typeSelect = document.getElementById('newListType');
      const urlInput = document.getElementById('newListUrl');

      const name = titleInput.value.trim();
      const type = typeSelect.value;
      const url = urlInput.value.trim();

      if (!name || !url) {
        alert('Lütfen liste başlığı ve geçerli bir liste linki girin.');
        return;
      }

      customLists.push({ name, type, url });
      titleInput.value = '';
      urlInput.value = '';

      renderCustomLists();
      updateUrls();
    }

    function removeCustomList(idx) {
      customLists.splice(idx, 1);
      renderCustomLists();
      updateUrls();
    }

    function updateUrls() {
      const enableTrendingMovies = document.getElementById('enableTrendingMovies').checked;
      const enableTrendingSeries = document.getElementById('enableTrendingSeries').checked;
      const enableOscar = document.getElementById('enableOscar').checked;
      const enableTop250 = document.getElementById('enableTop250').checked;
      const enableTrailers = document.getElementById('enableTrailers').checked;
      const rpdbKey = document.getElementById('rpdbKey').value.trim();

      const letterboxdUser = document.getElementById('letterboxdUser').value.trim();
      const enableLbxWatchlist = document.getElementById('enableLbxWatchlist').checked;
      const enableLbxDiary = document.getElementById('enableLbxDiary').checked;

      const traktUser = document.getElementById('traktUser').value.trim();
      const enableTraktWatchlist = document.getElementById('enableTraktWatchlist').checked;

      // Toggle dynamic sub-switch visibility
      document.getElementById('lbxToggles').style.display = letterboxdUser ? 'block' : 'none';
      document.getElementById('traktToggles').style.display = traktUser ? 'block' : 'none';

      const configObj = {
        enableTrendingMovies,
        enableTrendingSeries,
        enableOscar,
        enableTop250,
        enableTrailers,
        rpdbKey,
        letterboxdUser,
        enableLbxWatchlist,
        enableLbxDiary,
        traktUser,
        enableTraktWatchlist,
        customLists
      };

      const jsonStr = JSON.stringify(configObj);
      const base64Config = btoa(unescape(encodeURIComponent(jsonStr)));
      const origin = window.location.origin;
      const manifestUrl = `${origin}/${base64Config}/manifest.json`;
      const stremioProtocolUrl = `stremio://${manifestUrl.replace(/^https?:\/\//, '')}`;

      document.getElementById('installBtn').href = stremioProtocolUrl;
      window.lastGeneratedManifestUrl = manifestUrl;
      return manifestUrl;
    }

    document.getElementById('addListBtn').addEventListener('click', addCustomList);

    document.querySelectorAll('input, select').forEach(elem => {
      elem.addEventListener('input', updateUrls);
      elem.addEventListener('change', updateUrls);
    });

    document.getElementById('copyBtn').addEventListener('click', () => {
      const url = updateUrls();
      navigator.clipboard.writeText(url).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.innerText = '✅ Kopyalandı!';
        setTimeout(() => { btn.innerText = '📋 Manifest Linkini Kopyala'; }, 2000);
      });
    });

    renderCustomLists();
    updateUrls();
  </script>
</body>
</html>
