<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090b10;
      --card-bg: rgba(22, 27, 34, 0.85);
      --border: rgba(255, 255, 255, 0.1);
      --primary: #7a5af8;
      --primary-hover: #9373f9;
      --accent-green: #00d26a;
      --accent-danger: #f85149;
      --accent-patreon: #ff424d;
      --text: #f0f6fc;
      --text-muted: #8b949e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif; }

    body {
      background: radial-gradient(circle at top right, #1f1b3c, var(--bg) 65%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px 16px;
    }

    .container {
      width: 100%;
      max-width: 580px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.7);
      position: relative;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .header-title { font-size: 2rem; font-weight: 800; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
    .badge-ce {
      font-size: 0.65rem;
      font-weight: 700;
      background: rgba(122, 90, 248, 0.25);
      color: var(--primary-hover);
      border: 1px solid var(--primary);
      padding: 3px 8px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .lang-select {
      width: auto !important;
      padding: 6px 12px !important;
      font-size: 0.85rem !important;
      background: rgba(13, 17, 23, 0.9) !important;
      border: 1px solid var(--border) !important;
      border-radius: 10px !important;
      color: #fff !important;
      cursor: pointer;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin: 22px 0 10px 0;
    }

    /* Switch Component */
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: rgba(13, 17, 23, 0.5);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .switch-row.sub-switch {
      margin-left: 12px;
      background: rgba(13, 17, 23, 0.3);
      border-left: 3px solid var(--primary);
    }
    .switch-label { font-size: 0.92rem; font-weight: 600; }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.15);
      transition: .3s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(20px); }

    /* Custom List Box */
    .custom-list-box {
      background: rgba(13, 17, 23, 0.6);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .input-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    input[type="text"], select {
      width: 100%;
      padding: 11px 14px;
      background: rgba(9, 11, 16, 0.85);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #fff;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: var(--primary); }

    .btn-add {
      width: 100%;
      padding: 10px;
      background: rgba(122, 90, 248, 0.2);
      border: 1px solid var(--primary);
      color: #fff;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-add:hover { background: var(--primary); }
    .btn-add:disabled { opacity: 0.5; cursor: not-allowed; }

    .validation-msg {
      font-size: 0.8rem;
      margin-top: 6px;
      padding: 6px 10px;
      border-radius: 6px;
      display: none;
    }
    .validation-msg.error {
      display: block;
      background: rgba(248, 81, 73, 0.15);
      color: var(--accent-danger);
      border: 1px solid rgba(248, 81, 73, 0.3);
    }
    .validation-msg.success {
      display: block;
      background: rgba(0, 210, 106, 0.15);
      color: var(--accent-green);
      border: 1px solid rgba(0, 210, 106, 0.3);
    }

    .list-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px;
    }

    .list-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: rgba(22, 27, 34, 0.95);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.85rem;
    }
    .list-info { display: flex; align-items: center; gap: 8px; overflow: hidden; }
    .list-name { font-weight: 600; }
    .list-tag { font-size: 0.7rem; padding: 2px 6px; background: rgba(255,255,255,0.1); border-radius: 4px; }
    .list-count { font-size: 0.75rem; color: var(--accent-green); }
    .btn-del {
      background: none;
      border: none;
      color: var(--accent-danger);
      cursor: pointer;
      font-size: 0.95rem;
      padding: 2px 6px;
    }

    .form-group { margin-bottom: 12px; }
    label.field-label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 6px; color: var(--text); }

    .btn-container { display: flex; flex-direction: column; gap: 8px; margin-top: 26px; }

    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      transition: transform 0.15s, background-color 0.2s;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); }

    .btn-secondary { background: rgba(255, 255, 255, 0.08); color: var(--text); }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.15); }

    .btn-patreon {
      background: rgba(255, 66, 77, 0.15);
      border: 1px solid var(--accent-patreon);
      color: #fff;
      margin-top: 6px;
    }
    .btn-patreon:hover {
      background: var(--accent-patreon);
      color: #fff;
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    .footer a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
    .footer a:hover { color: #fff; text-decoration: underline; }
  </style>
</head>

  <div class="container">
    <div class="top-bar">
      <div class="header-title">
        <span id="tTitle">CinePilot</span>
        <span class="badge-ce">Studio v6.2</span>
      </div>
      <select id="langSelect" class="lang-select">
        <option value="tr">🇹🇷 Türkçe</option>
        <option value="en" selected>🇺🇸 English</option>
        <option value="es">🇪🇸 Español</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="it">🇮🇹 Italiano</option>
        <option value="ja">🇯🇵 日本語</option>
        <option value="ko">🇰🇷 한국어</option>
        <option value="zh">🇨🇳 中文</option>
      </select>
    </div>

    <!-- 1. Catalogs -->
    <div class="section-title" id="tCatalogsTitle">Catalogs</div>
    
    <div class="switch-row">
      <span class="switch-label" id="tTrendingMovies">🔥 Trending Movies</span>
      <label class="switch">
        <input type="checkbox" id="enableTrendingMovies" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="switch-row">
      <span class="switch-label" id="tTrendingSeries">📺 Trending Series</span>
      <label class="switch">
        <input type="checkbox" id="enableTrendingSeries" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="switch-row">
      <span class="switch-label" id="tOscar">✨ Oscar Collection</span>
      <label class="switch">
        <input type="checkbox" id="enableOscar" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="switch-row">
      <span class="switch-label" id="tTop250">🏆 IMDb Top 250</span>
      <label class="switch">
        <input type="checkbox" id="enableTop250" checked>
        <span class="slider"></span>
      </label>
    </div>

    <!-- 2. Custom List Addition -->
    <div class="section-title" id="tCustomListTitle">Add Custom List</div>
    <div class="custom-list-box">
      <div class="input-grid">
        <input type="text" id="newListTitle" placeholder="List Title (e.g. Marvel Universe)">
        <select id="newListType">
          <option value="movie" id="tOptMovie">Movie</option>
          <option value="series" id="tOptSeries">Series</option>
        </select>
      </div>
      <input type="text" id="newListUrl" placeholder="Letterboxd or TMDB List URL">
      <div id="listValidationMsg" class="validation-msg"></div>
      <button type="button" class="btn-add" id="addListBtn" style="margin-top: 8px;">+ Verify & Add List</button>

      <div class="list-container" id="customListsContainer"></div>
    </div>

    <!-- 3. Settings & API Keys -->
    <div class="section-title" id="tSettingsTitle">Settings</div>
    
    <div class="form-group">
      <label class="field-label" id="tRpdbLabel">RPDB API Key</label>
      <input type="text" id="rpdbKey" placeholder="RPDB API Key (Optional)">
    </div>

    <!-- Letterboxd Username & Dynamic Toggles -->
    <div class="form-group">
      <label class="field-label" id="tLetterboxdLabel">Letterboxd Username</label>
      <input type="text" id="letterboxdUser" placeholder="Letterboxd Username (Optional)">
    </div>

    <div id="lbxToggles" style="display: none; margin-bottom: 12px;">
      <div class="switch-row sub-switch">
        <span class="switch-label" id="tWatchlist">📌 Watchlist</span>
        <label class="switch">
          <input type="checkbox" id="enableLbxWatchlist" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="switch-row sub-switch">
        <span class="switch-label" id="tDiary">🍿 Watched Movies (Diary)</span>
        <label class="switch">
          <input type="checkbox" id="enableLbxDiary" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Trailers Switch -->
    <div class="switch-row">
      <span class="switch-label" id="tTrailers">🎬 Official Trailers</span>
      <label class="switch">
        <input type="checkbox" id="enableTrailers" checked>
        <span class="slider"></span>
      </label>
    </div>

    <!-- 4. Install, Copy & Support Buttons -->
    <div class="btn-container">
      <a href="#" id="installBtn" class="btn btn-primary">🚀 Install to Stremio</a>
      <button type="button" id="copyBtn" class="btn btn-secondary">📋 Copy Manifest Link</button>
      <a href="https://www.patreon.com/c/cagrigoksel/membership" target="_blank" id="patreonBtn" class="btn btn-patreon">☕ Support Project on Patreon</a>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span>CinePilot Studio</span>
      <span>Built for Movie Lovers</span>
    </div>
  </div>

      zh: {

        enterUrlError: '⚠️ 请输入有效的链接。'

    let currentLang = 'en';
    let customLists = [];

    function applyLanguage(lang) {
      currentLang = I18N[lang] ? lang : 'en';
      const t = I18N[currentLang];

      document.getElementById('tTitle').innerText = t.title;
      document.getElementById('tCatalogsTitle').innerText = t.catalogsTitle;
      document.getElementById('tTrendingMovies').innerText = t.trendingMovies;
      document.getElementById('tTrendingSeries').innerText = t.trendingSeries;
      document.getElementById('tOscar').innerText = t.oscar;
      document.getElementById('tTop250').innerText = t.top250;
      document.getElementById('tCustomListTitle').innerText = t.customListTitle;
      document.getElementById('newListTitle').placeholder = t.listTitlePlaceholder;
      document.getElementById('newListUrl').placeholder = t.listUrlPlaceholder;
      document.getElementById('tOptMovie').innerText = t.optMovie;
      document.getElementById('tOptSeries').innerText = t.optSeries;
      document.getElementById('addListBtn').innerText = t.addListBtn;
      document.getElementById('tSettingsTitle').innerText = t.settingsTitle;
      document.getElementById('tRpdbLabel').innerText = t.rpdbLabel;
      document.getElementById('rpdbKey').placeholder = t.rpdbPlaceholder;
      document.getElementById('tLetterboxdLabel').innerText = t.letterboxdLabel;
      document.getElementById('letterboxdUser').placeholder = t.letterboxdPlaceholder;
      document.getElementById('tWatchlist').innerText = t.watchlist;
      document.getElementById('tDiary').innerText = t.diary;
      document.getElementById('tTrailers').innerText = t.trailers;
      document.getElementById('installBtn').innerText = t.installBtn;
      document.getElementById('copyBtn').innerText = t.copyBtn;
      document.getElementById('patreonBtn').innerText = t.patreonBtn;

      renderCustomLists();
      updateUrls();
    }

    function renderCustomLists() {
      const container = document.getElementById('customListsContainer');
      const t = I18N[currentLang];
      container.innerHTML = '';

      if (customLists.length === 0) {
        container.innerHTML = `<div style="font-size:0.78rem; color:var(--text-muted); text-align:center; padding:4px;">${t.noLists}</div>`;
        return;
      }

      customLists.forEach((list, idx) => {
        const div = document.createElement('div');
        div.className = 'list-card';
        div.innerHTML = `
          <div class="list-info">
            <span class="list-tag">${list.type === 'series' ? t.optSeries.toUpperCase() : t.optMovie.toUpperCase()}</span>
            <span class="list-name">${escapeHtml(list.name)}</span>
            ${list.count ? `<span class="list-count">(${list.count})</span>` : ''}
          </div>
          <button type="button" class="btn-del" onclick="removeCustomList(${idx})">✕</button>
        `;
        container.appendChild(div);
      });
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    async function addCustomList() {
      const titleInput = document.getElementById('newListTitle');
      const typeSelect = document.getElementById('newListType');
      const urlInput = document.getElementById('newListUrl');
      const msgDiv = document.getElementById('listValidationMsg');
      const btn = document.getElementById('addListBtn');
      const t = I18N[currentLang];

      const name = titleInput.value.trim();
      const type = typeSelect.value;
      const url = urlInput.value.trim();

      msgDiv.className = 'validation-msg';
      msgDiv.style.display = 'none';

      if (!name) {
        msgDiv.className = 'validation-msg error';
        msgDiv.innerText = t.enterTitleError;
        return;
      }

      if (!url || (!url.startsWith('http://') && !url.startsWith('https://'))) {
        msgDiv.className = 'validation-msg error';
        msgDiv.innerText = t.enterUrlError;
        return;
      }

      btn.disabled = true;
      btn.innerText = t.validating;

      try {
        const res = await fetch(`/api/validate-list?url=${encodeURIComponent(url)}`).then(r => r.json());
        if (res.valid) {
          customLists.push({ name, type, url, count: res.count });
          titleInput.value = '';
          urlInput.value = '';
          msgDiv.className = 'validation-msg success';
          msgDiv.innerText = `${t.verifiedSuccess} (${res.count})`;
          setTimeout(() => { msgDiv.style.display = 'none'; }, 3000);
          renderCustomLists();
          updateUrls();
        } else {
          msgDiv.className = 'validation-msg error';
          msgDiv.innerText = `⚠️ ${res.error || 'Invalid list URL!'}`;
        }
      } catch (e) {
        msgDiv.className = 'validation-msg error';
        msgDiv.innerText = '⚠️ Server connection error.';
      } finally {
        btn.disabled = false;
        btn.innerText = t.addListBtn;
      }
    }

    function removeCustomList(idx) {
      customLists.splice(idx, 1);
      renderCustomLists();
      updateUrls();
    }

    function updateUrls() {
      const enableTrendingMovies = document.getElementById('enableTrendingMovies').checked;
      const enableTrendingSeries = document.getElementById('enableTrendingSeries').checked;
      const enableOscar = document.getElementById('enableOscar').checked;
      const enableTop250 = document.getElementById('enableTop250').checked;
      const enableTrailers = document.getElementById('enableTrailers').checked;
      const rpdbKey = document.getElementById('rpdbKey').value.trim();

      const letterboxdUser = document.getElementById('letterboxdUser').value.trim();
      const enableLbxWatchlist = document.getElementById('enableLbxWatchlist').checked;
      const enableLbxDiary = document.getElementById('enableLbxDiary').checked;

      document.getElementById('lbxToggles').style.display = letterboxdUser ? 'block' : 'none';

      const configObj = {
        lang: currentLang,
        enableTrendingMovies,
        enableTrendingSeries,
        enableOscar,
        enableTop250,
        enableTrailers,
        rpdbKey,
        letterboxdUser,
        enableLbxWatchlist,
        enableLbxDiary,
        customLists
      };

      const jsonStr = JSON.stringify(configObj);
      const base64Config = btoa(unescape(encodeURIComponent(jsonStr)));
      const origin = window.location.origin;
      const manifestUrl = `${origin}/${base64Config}/manifest.json`;
      const stremioProtocolUrl = `stremio://${manifestUrl.replace(/^https?:\/\//, '')}`;

      document.getElementById('installBtn').href = stremioProtocolUrl;
      window.lastGeneratedManifestUrl = manifestUrl;
      return manifestUrl;
    }

    document.getElementById('langSelect').addEventListener('change', (e) => {
      applyLanguage(e.target.value);
    });

    document.getElementById('addListBtn').addEventListener('click', addCustomList);

    document.querySelectorAll('input, select').forEach(elem => {
      elem.addEventListener('input', updateUrls);
      elem.addEventListener('change', updateUrls);
    });

    document.getElementById('copyBtn').addEventListener('click', () => {
      const t = I18N[currentLang];
      const url = updateUrls();
      navigator.clipboard.writeText(url).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.innerText = t.copied;
        setTimeout(() => { btn.innerText = t.copyBtn; }, 2000);
      });
    });

    // Auto-detect browser language or default to English/Turkish
    const browserLang = (navigator.language || 'en').split('-')[0];
    const initialLang = I18N[browserLang] ? browserLang : 'en';
    document.getElementById('langSelect').value = initialLang;
    applyLanguage(initialLang);
  </script>
